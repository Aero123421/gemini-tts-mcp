name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint & security check (ruff)
        uses: astral-sh/ruff-action@v3
        with:
          args: check src tests
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Run unit & fuzz tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - name: Run integration tests with installed dependencies
        run: |
          uv run python -c "import fastmcp, google.genai, pydantic, starlette"
          uv run python -m unittest discover -s tests -p test_integration.py -v
